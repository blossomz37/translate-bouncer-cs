name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (pinned)
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -c requirements.lock -e ".[dev]"
      - name: Tests
        run: python -m pytest tests/server/ -q
      - name: Lint
        run: ruff check server tests
      - name: Type check
        run: mypy server tests

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Type check + build
        run: npm run build
